name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch-package:
    name: Arch package
    uses: ./.github/workflows/packages.yml

  release-gates:
    name: Release gates
    if: always()
    needs: [quality, dependencies, spelling, arch-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every automated gate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = 'success,success,success,success'

  quality:
    name: Quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native development libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes python3 dbus-x11 libgtk-4-bin desktop-file-utils bubblewrap ffmpeg ffmpegthumbnailer imagemagick libarchive-tools libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libheif-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate workflow definitions with pinned actionlint
        run: |
          python3 scripts/check-tools.py --install --root "$RUNNER_TEMP/hermes-check-tools" --only actionlint
          "$RUNNER_TEMP/hermes-check-tools/bin/actionlint"

      - name: Validate app icons and isolated launcher installation
        run: python3 scripts/test_app_identity.py

      - name: Validate reversible desktop setup without changing host defaults
        run: |
          python3 scripts/test_desktop_integration.py
          python3 scripts/test_picker_integration.py

      - name: Check compilation
        run: cargo check --locked --all-targets --all-features

      - name: Validate immutable release controls offline
        run: python3 -m unittest discover -s scripts -p 'release_test*.py' -v

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: python3 scripts/check-test-suite.py

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.99.0'

      - name: Cache checking tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned checking tools
        run: |
          python3 scripts/check-tools.py --install --root "$RUNNER_TEMP/hermes-check-tools" --only cargo-deny
          echo "$RUNNER_TEMP/hermes-check-tools/bin" >> "$GITHUB_PATH"

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check

  spelling:
    name: Spelling
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.99.0'

      - name: Install pinned checking tools
        run: |
          python3 scripts/check-tools.py --install --root "$RUNNER_TEMP/hermes-check-tools" --only typos-cli
          echo "$RUNNER_TEMP/hermes-check-tools/bin" >> "$GITHUB_PATH"

      - name: Check spelling
        run: typos
