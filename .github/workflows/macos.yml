name: macOS Dev

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    name: Apple Silicon Dev build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.99.0'

      - name: Install native libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew bundle --file=packaging/macos/Brewfile

      - name: Record native build environment
        run: |
          mkdir -p macos-evidence
          test "$(uname -m)" = arm64
          {
            git rev-parse HEAD
            uname -m
            sw_vers
            xcodebuild -version
            rustc -Vv
            brew list --versions
            pkg-config --modversion gtk4 gtksourceview-5 gstreamer-1.0 libheif poppler-glib fontconfig
          } > macos-evidence/environment.txt

      - name: Cache native compilation
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-dev-arm64

      - name: Build Apple Silicon Dev binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          HERMES_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          cargo build --locked --features macos-dev --jobs 2 2>&1 | tee macos-evidence/build.log

      - name: Check native CLI and profile identity
        run: |
          ./target/debug/hermes --version | tee macos-evidence/version.txt
          ./target/debug/hermes --diagnostics > macos-evidence/diagnostics.txt

      - name: Validate and assemble Dev app
        run: |
          python3 -B scripts/test_macos_bundle.py
          python3 scripts/build-macos-dev.py --binary target/debug/hermes --output macos-candidate --source-commit "$(git rev-parse HEAD)"
          codesign --force --sign - "macos-candidate/Hermes Dev.app"
          codesign --verify --strict --verbose=2 "macos-candidate/Hermes Dev.app"
          otool -L "macos-candidate/Hermes Dev.app/Contents/MacOS/hermes" > macos-evidence/linked-libraries.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          candidate = pathlib.Path('macos-candidate')
          source = json.loads((candidate / 'SOURCE-INFO.json').read_text())
          binary = candidate / 'Hermes Dev.app/Contents/MacOS/hermes'
          source['binary_sha256'] = hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
          source['signing'] = 'ad-hoc, not notarized'
          (candidate / 'SOURCE-INFO.json').write_text(json.dumps(source, indent=2) + '\n')
          info = json.loads((candidate / 'BUILD-INFO.json').read_text())
          for key, command in {'dependency_versions': ['brew', 'list', '--versions'], 'sdk': ['xcrun', '--show-sdk-version'], 'toolchain': ['rustc', '-Vv']}.items():
              info[key] = subprocess.check_output(command, text=True).strip()
          (candidate / 'BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
          cp macos-evidence/environment.txt macos-evidence/linked-libraries.txt macos-candidate/
          ditto -c -k --sequesterRsrc --keepParent macos-candidate Hermes-Dev-arm64.zip
          shasum -a 256 Hermes-Dev-arm64.zip > Hermes-Dev-arm64.zip.sha256

      - name: Publish first-launch candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-macos-arm64-dev
          path: |
            Hermes-Dev-arm64.zip
            Hermes-Dev-arm64.zip.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-macos-arm64-evidence
          path: macos-evidence/
          retention-days: 14
          if-no-files-found: warn
