name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full lowercase 40-character commit SHA reachable from the default branch
        required: true
        type: string
      version:
        description: Version already committed in Cargo.toml and Cargo.lock (no leading v)
        required: true
        type: string
      channel:
        description: Deliberate release channel (no automatic promotion)
        required: true
        type: choice
        options:
          - preview
          - rc
          - stable
      confirmation:
        description: 'Type exactly: release CHANNEL vVERSION FULL_SHA'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RELEASE_RUST_VERSION: '1.99.0'
  SOURCE_SHA: ${{ inputs.source_sha }}
  VERSION: ${{ inputs.version }}
  CHANNEL: ${{ inputs.channel }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  prepare:
    name: Validate approved source and exact-commit CI
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      version: ${{ steps.gate.outputs.version }}
      channel: ${{ steps.gate.outputs.channel }}
      tag: ${{ steps.gate.outputs.tag }}
      ci_run: ${{ steps.gate.outputs.ci_run }}
    steps:
      # Control code is taken from the dispatched default-branch workflow commit.
      # The approved source may be an older ancestor and is never executed here.
      - name: Check out release control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Run release validator tests
        run: python3 -m unittest discover -s pipeline/scripts -p 'release_test*.py' -v
      - name: Validate immutable source, CI, and required reviewer configuration
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/scripts/release.py gate --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --confirmation "$CONFIRMATION" --evidence "$RUNNER_TEMP/preparation.json"
          cat "$RUNNER_TEMP/preparation.json" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Linux ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - name: Check out release control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Validate committed versions before building
        run: |
          python3 pipeline/scripts/release.py source --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --confirmation "$CONFIRMATION"
      - name: Install native development libraries on the disposable runner
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libheif-dev
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; explicit compiler below
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: source -> target
          key: release-1.99.0-${{ matrix.target }}
      - name: Build committed version and resolve locked dependency inventory
        working-directory: source
        env:
          TARGET: ${{ matrix.target }}
          HERMES_BUILD_COMMIT: ${{ needs.prepare.outputs.source_sha }}
        run: |
          cargo +1.99.0 build --release --locked --target "$TARGET" --bin hermes
          cargo +1.99.0 metadata --locked --format-version 1 --filter-platform "$TARGET" > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Bundle Linux binary and dependency license inventory
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 pipeline/scripts/release_artifacts.py bundle --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --target "$TARGET" --metadata "$RUNNER_TEMP/cargo-metadata.json" --output dist
      - name: Upload target-specific assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Approve, attest, tag, and publish immutable source
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      CI_RUN: ${{ needs.prepare.outputs.ci_run }}
    steps:
      - name: Check out trusted release control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
      - name: Check out approved source for tag-only publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          fetch-depth: 0
          # Only this approved job has repository write credentials. No build or
          # package hooks from the source checkout execute in this job.
          persist-credentials: true
      - name: Recheck CI, default-branch reachability, and recorded approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/scripts/release.py gate --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --confirmation "$CONFIRMATION" --ci-run "$CI_RUN" --require-approval \
            --evidence "$RUNNER_TEMP/approval.json"
      - name: Download only this run's Linux build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate build identities and seal source, inventories, and checksums
        run: |
          python3 pipeline/scripts/release_artifacts.py assemble --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --evidence "$RUNNER_TEMP/approval.json" --output dist
      - name: Attest workflow provenance for sealed assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest approved source and per-target build identities
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://github.com/battlemountain2/hermes/attestations/release/v1
          predicate-path: dist/release-manifest.json
      - name: Revalidate and publish only the approved immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/scripts/release.py publish --source source \
            --sha "$SOURCE_SHA" --version "$VERSION" --channel "$CHANNEL" \
            --confirmation "$CONFIRMATION" --ci-run "$CI_RUN" --require-approval --dist dist
